<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REST API & AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 760px">
        <div class="card-body p-5">
            <span class="badge text-bg-primary mb-3">Spring Boot RESTful API</span>
            <h1 class="display-6 fw-semibold">Quản lý cửa hàng bằng AJAX</h1>
            <p class="lead text-secondary">CRUD Category và Product không tải lại toàn bộ trang.</p>
            <div class="d-grid gap-3 d-md-flex mt-4">
                <a class="btn btn-primary btn-lg" th:href="@{/admin/categories}">Quản lý Category</a>
                <a class="btn btn-outline-primary btn-lg" th:href="@{/admin/products}">Quản lý Product</a>
                <a class="btn btn-outline-secondary btn-lg" th:href="@{/swagger-ui/index.html}">Swagger UI</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
