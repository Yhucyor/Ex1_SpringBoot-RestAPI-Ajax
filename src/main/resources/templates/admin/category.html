<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="context-path" th:content="@{/}">
    <title>Quản lý Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        .thumb { width: 72px; height: 56px; object-fit: cover; border-radius: .5rem; background: #eef1f5; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">REST API & AJAX</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link active" th:href="@{/admin/categories}">Category</a>
            <a class="nav-link" th:href="@{/admin/products}">Product</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Quản lý Category</h1>
            <p class="text-secondary mb-0">Dữ liệu được đọc và cập nhật qua REST API bằng AJAX.</p>
        </div>
        <button class="btn btn-primary" id="openCreateCategory" type="button">
            <i class="fa-solid fa-plus me-2"></i>Thêm Category
        </button>
    </div>

    <div id="categoryAlert" class="alert d-none" role="alert"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Icon</th>
                        <th>Tên Category</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="categoryTableBody">
                    <tr><td colspan="4" class="text-center py-5 text-secondary">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="createCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addCategoryForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">Thêm Category</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="newCategoryName">Tên Category</label>
                        <input class="form-control" id="newCategoryName" name="categoryName" required maxlength="255">
                    </div>
                    <div>
                        <label class="form-label" for="newCategoryIcon">Icon</label>
                        <input class="form-control" type="file" id="newCategoryIcon" name="icon" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Thêm mới</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="updateCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="updateCategoryForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">Cập nhật Category</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="updateCategoryId" name="categoryId">
                    <div class="mb-3">
                        <label class="form-label" for="updateCategoryName">Tên Category</label>
                        <input class="form-control" id="updateCategoryName" name="categoryName" required maxlength="255">
                    </div>
                    <div>
                        <label class="form-label" for="updateCategoryIcon">Icon mới</label>
                        <input class="form-control" type="file" id="updateCategoryIcon" name="icon" accept="image/*">
                        <div class="form-text">Để trống nếu muốn giữ icon hiện tại.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/category.js}"></script>
</body>
</html>
