<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="context-path" th:content="@{/}">
    <title>Quản lý Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        .thumb { width: 76px; height: 58px; object-fit: cover; border-radius: .5rem; background: #eef1f5; }
        .table td, .table th { vertical-align: middle; }
        .description-cell { min-width: 220px; max-width: 320px; white-space: normal; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">REST API & AJAX</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" th:href="@{/admin/categories}">Category</a>
            <a class="nav-link active" th:href="@{/admin/products}">Product</a>
        </div>
    </div>
</nav>

<main class="container-fluid px-lg-5 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Quản lý Product</h1>
            <p class="text-secondary mb-0">CRUD Product và liên kết Category qua REST API.</p>
        </div>
        <button class="btn btn-primary" id="openCreateProduct" type="button">
            <i class="fa-solid fa-plus me-2"></i>Thêm Product
        </button>
    </div>

    <div id="productAlert" class="alert d-none" role="alert"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Category</th>
                        <th>Số lượng</th>
                        <th>Đơn giá</th>
                        <th>Giảm giá</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="productTableBody">
                    <tr><td colspan="9" class="text-center py-5 text-secondary">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="productForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="productModalTitle">Thêm Product</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="productId" name="productId">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="productName">Tên sản phẩm</label>
                            <input class="form-control" id="productName" name="productName" required maxlength="500">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="categoryId">Category</label>
                            <select class="form-select" id="categoryId" name="categoryId" required></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="quantity">Số lượng</label>
                            <input class="form-control" type="number" min="0" id="quantity" name="quantity" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="unitPrice">Đơn giá</label>
                            <input class="form-control" type="number" min="0" step="0.01" id="unitPrice" name="unitPrice" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="discount">Giảm giá</label>
                            <input class="form-control" type="number" min="0" step="0.01" id="discount" name="discount" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="imageFile">Ảnh sản phẩm</label>
                            <input class="form-control" type="file" id="imageFile" name="imageFile" accept="image/*">
                            <div class="form-text" id="imageHelp">Có thể để trống.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="status">Trạng thái</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="1">Đang bán</option>
                                <option value="0">Ngừng bán</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">Mô tả</label>
                            <textarea class="form-control" rows="4" id="description" name="description" required maxlength="500"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary" id="saveProductButton">Thêm mới</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/product.js}"></script>
</body>
</html>
